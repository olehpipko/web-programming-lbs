<!-- @format -->

<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Завдання 2. Таблиці - Лабораторна робота №2</title>

		<style>
			:root {
				--black-color: #000000;
				--white-color: #ffffff;

				--red-color: #ff5b2d;
				--yellow-color: #fffa69;
				--blue-color: #074481;
			}

			table {
				width: 400px;
				height: 400px;
				border-collapse: collapse;
				border-style: hidden;
			}

			td {
				border: 5px solid var(--black-color);
			}
		</style>
	</head>
	<body>
		<header>
			<h1>Композиція з червоним, синім і жовтим</h1>
			<p>
				Верстка картини Піта Мондріана "Композиція з червоним, синім і
				жовтим", використовуючи таблицю
			</p>
		</header>
		<main>
			<table>
				<tr>
					<td
						rowspan="1"
						colspan="2"
						style="background-color: var(--white-color)"
					></td>
					<td
						rowspan="1"
						colspan="3"
						style="background-color: var(--white-color)"
					></td>
					<td
						rowspan="1"
						colspan="2"
						style="background-color: var(--yellow-color)"
					></td>
				</tr>
				<tr>
					<td
						rowspan="2"
						colspan="1"
						style="background-color: var(--white-color)"
					></td>
					<td
						rowspan="4"
						colspan="4"
						style="background-color: var(--red-color)"
					></td>
					<td
						rowspan="2"
						colspan="2"
						style="background-color: var(--yellow-color)"
					></td>
				</tr>
				<tr></tr>
				<tr>
					<td
						rowspan="3"
						colspan="1"
						style="background-color: var(--white-color)"
					></td>
					<td
						rowspan="2"
						colspan="1"
						style="background-color: var(--white-color)"
					></td>
					<td
						rowspan="2"
						colspan="1"
						style="background-color: var(--white-color)"
					></td>
				</tr>
				<tr></tr>
				<tr>
					<td
						rowspan="2"
						colspan="2"
						style="background-color: var(--black-color)"
					></td>
					<td
						rowspan="1"
						colspan="2"
						style="background-color: var(--white-color)"
					></td>
					<td
						rowspan="1"
						colspan="2"
						style="background-color: var(--white-color)"
					></td>
				</tr>
				<tr>
					<td
						rowspan="3"
						colspan="1"
						style="background-color: var(--yellow-color)"
					></td>
					<td
						rowspan="1"
						colspan="2"
						style="background-color: var(--white-color)"
					></td>
					<td
						rowspan="2"
						colspan="2"
						style="background-color: var(--blue-color)"
					></td>
				</tr>
				<tr>
					<td
						rowspan="2"
						colspan="2"
						style="background-color: var(--white-color)"
					></td>
					<td
						rowspan="1"
						colspan="2"
						style="background-color: var(--black-color)"
					></td>
				</tr>
				<tr>
					<td
						rowspan="1"
						colspan="4"
						style="background-color: var(--white-color)"
					></td>
				</tr>
			</table>
		</main>
	</body>
</html>
